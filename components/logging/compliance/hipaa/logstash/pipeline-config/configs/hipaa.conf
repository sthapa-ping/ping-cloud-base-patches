input {
  http {
    port => 8086
    codec => json
  }
}

filter {
  # Drop Kubernetes probe events received by the Logstash http input.
  if ([headers][request_method] == "GET") {
    drop {}
  }

  # PF, PA, and PD container log records from Fluent Bit carry the original app log line in [log].
  # If [log] is missing or empty, this is not a valid HIPAA app log event for this pipeline.
  if ![log] or [log] == "" {
    drop {}
  }

  # Parse [log] JSON into @metadata for validation only.
  json {
    source => "log"
    target => "[@metadata][hipaa_log]"
    tag_on_failure => ["_hipaa_log_json_parse_failure"]
  }

  # Drop records whose [log] field is not valid JSON.
  if "_hipaa_log_json_parse_failure" in [tags] {
    drop {}
  }

  # Defense-in-depth after the Fluent Bit grep: verify parsed PF/PA log_name values before writing to S3.
  if [@metadata][hipaa_log][log_name] {
    if !([@metadata][hipaa_log][log_name] =~ /^(audit|provisioner|admin-api|admin|pingaccess_api_audit|pingaccess_engine_audit|pingaccess_agent_audit|pingaccess_sideband_audit|pingaccess_sideband_client_audit)$/) {
      drop {}
    }
  }
  # Defense-in-depth after the Fluent Bit grep: PD access events identify by logType before normal Logstash processing would map them to pd-access.
  else if [@metadata][hipaa_log][logType] {
    if [@metadata][hipaa_log][logType] != "access" {
      drop {}
    }
  }
  # Drop valid JSON that lacks the expected HIPAA routing keys.
  else {
    drop {}
  }
}

output {
  s3 {
    region => "${AWS_REGION}"
    bucket => "${S3_BUCKET_NAME_HIPAA}"
    # HIPAA uses a fixed S3 key segment, so no per-event metadata field is needed for the prefix.
    prefix => "/hipaa/%{+YYYY}/%{+MM}/%{+dd}/%{+HH}/%{+mm}"
    time_file => "3"
    # Flush logs to S3 when file size reaches 100 MB (104857600 bytes)
    size_file => "104857600"
    codec => "json_lines"
    id => "hipaa_s3_out"
  }
}
