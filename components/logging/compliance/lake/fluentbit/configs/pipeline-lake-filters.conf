# Keep only lines that look like audit JSON (cheap text check, fast reject).
[FILTER]
    Name                grep
    Match               elk.lake.general.*
    Regex               log log_name"\s*:\s*"audit"

# Parse the JSON. Drops anything that isn't valid JSON.
[FILTER]
    Name                parser
    Match               elk.lake.general.*
    Key_Name            log
    Parser              json
    Reserve_Data        Off
    Preserve_Key        Off
