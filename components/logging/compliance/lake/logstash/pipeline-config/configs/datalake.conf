input {
  http {
    port => 8085
    codec => json
  }
}

filter {
  # Drop healthcheck probes
  if ([headers][request_method] == "GET") {
    drop {}
  }

  # Fluent Bit keeps the original container log in [log]; parse it here so this
  # pipeline does not depend on a Fluent Bit parser being loaded.
  if [log] {
    json {
      source => "log"
      skip_on_invalid_json => true
    }
  }

  # Only process PF audit logs
  if ![log_name] or [log_name] != "audit" {
    drop {}
  }

  ### Remove unneeded fields coming from fluent-bit
  mutate {
    remove_field => ["date", "headers", "_p", "log"]
  }

  ### Promote required schema fields from the parsed audit JSON
  mutate {
    rename => {
      "timestamp"    => "Timestamp"
      "event"        => "EventType"
      "subject"      => "UserId"
      "connectionId" => "ConnectionId"
    }
  }

  # Drop events without a usable user identifier
  mutate {
    strip => ["UserId"]
  }
  if ![UserId] or [UserId] == "" {
    drop {}
  }

  # Hash PII fields in place
  fingerprint {
    source => "UserId"
    target => "UserId"
    method => "SHA256"
  }
  fingerprint {
    source => "ConnectionId"
    target => "ConnectionId"
    method => "SHA256"
  }

  # Add enrichment fields
  mutate {
    add_field => {
      "Product"      => "PingFederate"
      "SalesforceId" => "${SALESFORCE_ID:}"
      "Environment" => "${ENV:}"
    }
  }

  ### Whitelist — drop everything not in the schema
  prune {
    whitelist_names => ["@timestamp", "Timestamp", "EventType", "UserId", "ConnectionId", "Product", "SalesforceId", "Environment"]
  }
}

output {
  s3 {
    region => "${AWS_REGION}"
    bucket => "${TELEMETRY_BUCKET_NAME}"
    prefix => "p1as-pingfederate/${TELEMETRY_BUCKET_NAME}/%{+YYYY}/%{+MM}/%{+dd}"
    time_file => "3"
    size_file => "104857600"
    codec => "json_lines"
    id => "datalake_s3_out"
  }
}
