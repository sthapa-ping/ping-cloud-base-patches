# ============================================================
# FILTERS
# ============================================================
#
# v4.x Improvements:
# - Multiline filter has better performance
# - Kubernetes filter has improved caching (Kube_Meta_Cache_TTL)
# - Better memory management with Buffer_Size
# ============================================================

[FILTER]
    Name                  multiline
    Match                 elk.kube.general.pingcloud
    multiline.key_content log
    buffer                true
    flush_ms              500
    emitter_name          elk.multiline
    emitter_storage.type  filesystem
    emitter_mem_buf_limit 256M
    multiline.parser      multiline_system_log,multiline_pf_admin_event_detail


# --------------------------------------------------------------
# Kubernetes Metadata Enrichment - S3 Logs
# --------------------------------------------------------------

[FILTER]
    Name                kubernetes
    Match               s3.kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_Tag_Prefix     s3.kube.var.log.containers.
    
    # Parse kubernetes metadata from log filename
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off
    
    # Minimize data added (performance optimization)
    Annotations         Off
    Labels              On
    
    # v4.x improvement: Better buffer management
    Buffer_Size         0
    
    # Use docker container ID for better cache hit rate
    Cache_Use_Docker_Id On
    
    # Cache TTL in seconds (30 minutes)
    # v4.x has more stable caching
    Kube_Meta_Cache_TTL 1800
    
    # Keep original tag structure
    Keep_Log            On
    Merge_Log           On


# --------------------------------------------------------------
# Kubernetes Metadata Enrichment - ELK Logs
# --------------------------------------------------------------

[FILTER]
    Name                kubernetes
    Match               elk.kube.general.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_Tag_Prefix     elk.kube.general.var.log.containers.
    
    K8S-Logging.Parser  On
    K8S-Logging.Exclude Off
    
    Annotations         Off
    Labels              On
    
    Buffer_Size         0
    Cache_Use_Docker_Id On
    Kube_Meta_Cache_TTL 1800
    
    Keep_Log            On
    Merge_Log           On


# ============================================================
# OUTPUTS (v4.x Enhanced with Workers)
# ============================================================
#
# CRITICAL v4.x IMPROVEMENTS:
# - Workers: Each output runs in dedicated thread(s)
# - Retry_Limit: Per-output failure tolerance
# - storage.total_limit_size: Prevents one output from exhausting disk
#
# ISOLATION STRATEGY:
# - S3/Archive outputs: Retry_Limit = False (never give up)
# - ELK outputs: Retry_Limit = 10 (fail gracefully after attempts)
# ============================================================

# --------------------------------------------------------------
# OUTPUT 1: ELK Main Pipeline (elk.kube.* logs)
# Priority: HIGH (application logs for search/analytics)
# --------------------------------------------------------------

[OUTPUT]
    Name                http
    Alias               logstash_elk_main
    Match               elk.kube.*
    
    # Destination
    Host                logstash-elastic.elastic-stack-logging
    Port                8080
    URI                 /
    Format              json
    
    # Compression (reduces network bandwidth)
    compress            gzip
    
    # v4.x WORKER ISOLATION
    # Each worker = dedicated thread
    # Recommended: 1-2 workers for HTTP outputs
    Workers             2
    
    # Connection pooling (v4.x improved)
    net.keepalive                   on
    net.keepalive_idle_timeout      30
    net.keepalive_max_recycle       100
    
    # Memory limit for this output's buffer
    # Prevents single output from consuming all memory
    storage.total_limit_size        256M
    
    # Retry strategy: Fail gracefully
    # After 10 retries, drop logs to prevent blocking
    Retry_Limit                     10
    
    # TLS (uncomment if needed)
    # tls                             on
    # tls.verify                      off


# --------------------------------------------------------------
# OUTPUT 2: ELK Customer Pipeline (elk.kube.* logs)
# Priority: MEDIUM (customer-specific analytics)
# --------------------------------------------------------------

[OUTPUT]
    Name                http
    Alias               logstash_elk_customer
    Match               elk.kube.*
    
    Host                logstash-elastic.elastic-stack-logging
    Port                8084
    URI                 /
    Format              json
    compress            gzip
    
    # v4.x WORKER ISOLATION
    Workers             2
    
    net.keepalive                   on
    net.keepalive_idle_timeout      30
    net.keepalive_max_recycle       100
    
    # Lower memory allocation (less critical)
    storage.total_limit_size        128M
    
    # More aggressive retry limit
    # This is a "nice to have" output
    Retry_Limit                     5


# --------------------------------------------------------------
# OUTPUT 3: S3/Archive Pipeline (ALL logs)
# Priority: CRITICAL (long-term storage, compliance)
# --------------------------------------------------------------
# 
# This is your CRITICAL output - it should NEVER stop
# Match: * (catches all logs including s3.kube.* and elk.kube.*)
# --------------------------------------------------------------

[OUTPUT]
    Name                http
    Alias               logstash_s3_archive
    Match               *
    
    Host                logstash-elastic.elastic-stack-logging
    Port                8081
    URI                 /
    Format              json
    compress            gzip
    
    # v4.x CRITICAL ISOLATION
    # More workers = higher throughput for critical path
    Workers             3
    
    net.keepalive                   on
    net.keepalive_max_recycle       200
    
    # Largest memory allocation for critical output
    storage.total_limit_size        512M
    
    # NEVER GIVE UP on critical logs
    # Retry_Limit False = infinite retries
    # Even if Logstash is down, keep trying forever
    Retry_Limit                     False
    
    # Optional: Add timeout for slow connections
    # Prevents worker threads from hanging
    net.connect_timeout             10
    net.keepalive_idle_timeout      60


# ============================================================
# CONFIGURATION NOTES
# ============================================================
#
# 1. WORKER ISOLATION:
#    - Each output with Workers > 0 runs in separate thread(s)
#    - If "logstash_elk_customer" fails, "logstash_s3_archive" continues
#    - This is the KEY to solving your "noisy neighbor" problem
#
# 2. RETRY STRATEGY:
#    - Critical (S3): Retry_Limit False = never give up
#    - Important (ELK main): Retry_Limit 10 = try hard, then drop
#    - Optional (Customer): Retry_Limit 5 = fail fast
#
# 3. MEMORY ALLOCATION:
#    - storage.total_limit_size per output prevents exhaustion
#    - Total across all outputs should be < pod memory limit
#    - Current total: 896M (256 + 128 + 512) < 2Gi pod limit ✓
#
