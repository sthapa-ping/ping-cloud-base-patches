apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: elastic-stack-logging
data:
  fluent-bit.conf: |-
    [SERVICE]
        # -------------------------------------------------
        # Core runtime
        # -------------------------------------------------

        # Flush interval in seconds (low latency, acceptable CPU)
        Flush                     1

        # Required for containerized execution
        Daemon                    Off

        # Parser definitions
        Parsers_File              parsers.conf


        # -------------------------------------------------
        # Filesystem buffering & backpressure (Fluent Bit v4.x)
        # -------------------------------------------------

        # Base directory for filesystem-backed buffering
        storage.path              /fluent-bit/state/flb-storage

        # HARD global disk safety cap (REQUIRED)
        # Prevents node disk exhaustion during prolonged outages
        # When reached, Fluent Bit tail-drops oldest data
        storage.total_limit_size  1G

        # Use OS buffering for best throughput
        storage.sync              normal

        # Disable per-chunk checksum (recommended for logs)
        storage.checksum          off

        # Max RAM used for backlog before spilling to disk
        # Protects pod memory during output failures
        storage.backlog.mem_limit 50M

        # Max number of active (in-memory) chunks
        # Prevents runaway memory growth
        storage.max_chunks_up     2000

        # Expose storage-related metrics via HTTP endpoint
        storage.metrics           on


        # -------------------------------------------------
        # Scheduler & retry behavior (unified scheduler v4.x)
        # -------------------------------------------------

        # Initial retry delay (seconds)
        scheduler.base            3

        # Maximum retry backoff cap (seconds)
        scheduler.cap             180


        # -------------------------------------------------
        # Shutdown handling
        # -------------------------------------------------

        # Time Fluent Bit will attempt to flush on SIGTERM
        # Must be < terminationGracePeriodSeconds
        Grace                     30


        # -------------------------------------------------
        # Health & observability
        # -------------------------------------------------

        # Enable HTTP server for metrics & health
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

        # Health reflects pipeline state (readiness semantics)
        Health_Check              On


    # -------------------------------------------------
    # Pipelines
    # -------------------------------------------------
    # Inputs, filters, and outputs are defined separately
    @INCLUDE elk.conf

